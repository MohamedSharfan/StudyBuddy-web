<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Reasons for being late to school"><rect width="640" height="420" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="320.0" y="30.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111827">Reasons for being late to school</text><path d="M220,225 L220.0,75.0 A150,150 0 0,1 266.4,367.7 Z" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="311.9" y="215.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">45%</text><rect x="420" y="110" width="18" height="18" fill="#2563eb"/><text x="446.0" y="124.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">Traffic (45%)</text><path d="M220,225 L266.4,367.7 A150,150 0 0,1 70.0,225.0 Z" fill="#f59e0b" stroke="#fff" stroke-width="2"/><text x="165.3" y="305.2" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">30%</text><rect x="420" y="142" width="18" height="18" fill="#f59e0b"/><text x="446.0" y="156.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">Waking up late (30%)</text><path d="M220,225 L70.0,225.0 A150,150 0 0,1 131.8,103.6 Z" fill="#10b981" stroke="#fff" stroke-width="2"/><text x="137.1" y="187.8" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">15%</text><rect x="420" y="174" width="18" height="18" fill="#10b981"/><text x="446.0" y="188.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">Bad weather (15%)</text><path d="M220,225 L131.8,103.6 A150,150 0 0,1 220.0,75.0 Z" fill="#ef4444" stroke="#fff" stroke-width="2"/><text x="191.3" y="141.6" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">10%</text><rect x="420" y="206" width="18" height="18" fill="#ef4444"/><text x="446.0" y="220.0" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">Other (10%)</text></g></svg>