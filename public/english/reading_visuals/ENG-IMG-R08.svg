<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" width="640" height="354" role="img" aria-label="NOTICE"><rect width="640" height="354" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><rect x="10" y="10" width="620" height="334" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="4"/><rect x="10" y="10" width="620" height="60" rx="14" fill="#1d4ed8"/><text x="320.0" y="50.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#ffffff">NOTICE</text><text x="320.0" y="105.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8">Tree-Planting Day</text><text x="320.0" y="133.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Organised by the Scout Troop</text><text x="320.0" y="163.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Date: Monday, 5 June (World Environment Day)</text><text x="320.0" y="193.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Time: 7.30 a.m.</text><text x="320.0" y="223.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Venue: the school ground</text><text x="320.0" y="253.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Open to: all students</text><text x="320.0" y="283.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Each student should bring one plant.</text><text x="320.0" y="313.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Contact: the Scout leader</text></g></svg>