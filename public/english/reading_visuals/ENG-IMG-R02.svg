<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" width="640" height="354" role="img" aria-label="NOTICE"><rect width="640" height="354" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><rect x="10" y="10" width="620" height="334" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="4"/><rect x="10" y="10" width="620" height="60" rx="14" fill="#1d4ed8"/><text x="320.0" y="50.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#ffffff">NOTICE</text><text x="320.0" y="105.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8">Inter-house Debate</text><text x="320.0" y="133.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Organised by the English Literary Association</text><text x="320.0" y="163.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Date: Friday, 6 June</text><text x="320.0" y="193.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Time: 1.30 p.m.</text><text x="320.0" y="223.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Venue: the main auditorium</text><text x="320.0" y="253.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Open to: students of Grades 9–11</text><text x="320.0" y="283.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Each house must send a team of three students.</text><text x="320.0" y="313.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Contact: Ms. Fernando (Teacher-in-charge)</text></g></svg>