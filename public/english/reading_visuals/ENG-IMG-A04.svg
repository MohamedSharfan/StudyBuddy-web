<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="COMPUTER COURSE FOR BEGINNERS"><rect width="640" height="300" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><rect x="10" y="10" width="620" height="280" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="4"/><rect x="10" y="10" width="620" height="60" rx="14" fill="#b45309"/><text x="320.0" y="50.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#ffffff">COMPUTER COURSE FOR BEGINNERS</text><text x="320.0" y="105.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Learn typing, email and the internet</text><text x="320.0" y="135.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Duration: 3 months</text><text x="320.0" y="165.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Weekdays: 4.00 p.m. – 6.00 p.m.</text><text x="320.0" y="195.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Certificate at the end</text><text x="320.0" y="225.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Fee: Rs. 6,000 for the full course</text><text x="320.0" y="255.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Register at the library office</text></g></svg>